<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="이미지와 한글 문구를 조합해 밈, 카드, SNS 이미지를 만드는 브라우저 편집 도구">
  <title>MIXIT 스튜디오</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="MIXIT 스튜디오 홈">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>MIXIT <b>STUDIO</b></span>
    </a>
    <div class="top-actions">
      <button class="button ghost" id="resetButton" type="button">새 작업</button>
      <button class="button dark" id="downloadPngButton" type="button">PNG 저장 <span aria-hidden="true">↓</span></button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel controls-panel" aria-label="편집 도구">
      <div class="panel-heading">
        <p class="eyebrow">EDIT</p>
        <h1>콘텐츠 편집</h1>
      </div>

      <div class="editor-tabs" role="tablist" aria-label="편집 도구 탭">
        <button class="editor-tab active" id="editTabButton" type="button" role="tab" aria-selected="true" aria-controls="editTab">편집</button>
        <button class="editor-tab" id="layersTabButton" type="button" role="tab" aria-selected="false" aria-controls="layersTab">항목 관리 <span id="layerCount">0</span></button>
      </div>

      <div class="tab-content active" id="editTab" role="tabpanel" aria-labelledby="editTabButton">
      <section class="control-section first-section">
        <div class="section-title">
          <span class="step">01</span>
          <h2>이미지</h2>
        </div>
        <label class="upload-zone" id="uploadZone" for="imageInput">
          <input id="imageInput" type="file" multiple accept="image/png,image/jpeg,.png,.jpg,.jpeg">
          <span class="upload-icon" aria-hidden="true">＋</span>
          <strong>이미지 추가하기</strong>
          <small>PNG, JPEG · 여러 장 추가 가능 · 최대 15MB</small>
        </label>
        <p class="status-message" id="fileMessage" role="status" aria-live="polite"></p>
        <button class="layer-shortcut" id="openLayersButton" type="button">추가한 이미지 항목 관리 <span aria-hidden="true">→</span></button>
      </section>

      <section class="control-section">
        <div class="section-title">
          <span class="step coral">02</span>
          <h2>문구</h2>
        </div>
        <label class="field text-field">한글 문구
          <textarea id="textInput" rows="3" maxlength="120">오늘도\n내가 해냄</textarea>
          <span class="char-count"><b id="charCount">10</b>/120</span>
        </label>
        <div class="two-col compact">
          <label class="field">글자 크기
            <div class="unit-input"><input id="fontSize" type="number" min="16" max="180" value="68"><span>px</span></div>
          </label>
          <label class="field">글자 색
            <div class="color-control"><input id="textColor" type="color" value="#ffffff"><span id="colorValue">#FFFFFF</span></div>
          </label>
        </div>
        <div class="alignment-group" role="group" aria-label="문구 정렬">
          <button class="align-button" data-align="left" type="button" aria-label="왼쪽 정렬">≡</button>
          <button class="align-button active" data-align="center" type="button" aria-label="가운데 정렬">≡</button>
          <button class="align-button" data-align="right" type="button" aria-label="오른쪽 정렬">≡</button>
        </div>
        <div class="two-col">
          <label class="field">가로 위치 <input id="textX" type="range" min="5" max="95" value="50"></label>
          <label class="field">세로 위치 <input id="textY" type="range" min="5" max="95" value="77"></label>
        </div>
      </section>
      </div>

      <div class="tab-content" id="layersTab" role="tabpanel" aria-labelledby="layersTabButton" hidden>
        <section class="control-section first-section">
          <div class="section-title">
            <span class="step ink">LAY</span>
            <div><h2>이미지 항목</h2><p class="section-help">위에 있는 항목이 카드의 앞쪽에 보여요.</p></div>
          </div>
          <div class="layer-list" id="layerList"></div>
        </section>

        <fieldset class="layer-controls" id="layerControls" disabled>
          <legend class="sr-only">선택한 이미지 조정</legend>
          <div class="selected-layer-heading">
            <div><span>선택한 이미지</span><strong id="selectedLayerName">항목을 선택해주세요</strong></div>
            <button class="icon-action danger" id="deleteLayerButton" type="button" aria-label="선택한 이미지 삭제">삭제</button>
          </div>
          <div class="slider-row">
            <label for="layerScale">크기</label>
            <output id="layerScaleValue">100%</output>
            <input id="layerScale" type="range" min="10" max="240" value="100">
          </div>
          <div class="slider-row">
            <label for="layerRotation">회전</label>
            <output id="layerRotationValue">0°</output>
            <input id="layerRotation" type="range" min="-180" max="180" value="0">
          </div>
          <div class="transform-buttons" role="group" aria-label="이미지 대칭">
            <button id="flipHorizontalButton" type="button"><span aria-hidden="true">↔</span> 좌우 대칭</button>
            <button id="flipVerticalButton" type="button"><span aria-hidden="true">↕</span> 상하 대칭</button>
          </div>
          <div class="two-col">
            <label class="field">가로 위치 <input id="layerX" type="range" min="-20" max="120" value="50"></label>
            <label class="field">세로 위치 <input id="layerY" type="range" min="-20" max="120" value="50"></label>
          </div>
          <p class="layer-drag-help">미리보기에서 선택한 이미지를 직접 드래그할 수도 있어요.</p>
        </fieldset>
      </div>
    </aside>

    <section class="stage" aria-label="이미지 미리보기">
      <div class="stage-head">
        <div>
          <p class="eyebrow">LIVE CANVAS</p>
          <h2>실시간 미리보기</h2>
        </div>
        <div class="ratio-picker" role="group" aria-label="이미지 비율">
          <button class="ratio-button active" data-ratio="1:1" type="button">1:1</button>
          <button class="ratio-button" data-ratio="4:5" type="button">4:5</button>
          <button class="ratio-button" data-ratio="9:16" type="button">9:16</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="previewCanvas" width="1080" height="1080" aria-label="편집 결과 미리보기"></canvas>
        <div class="drag-tip" id="dragTip">문구를 드래그해 옮겨보세요</div>
      </div>
      <div class="stage-footer">
        <span id="canvasSize">1080 × 1080 px</span>
        <span class="live-dot"><i></i> 변경 사항 자동 반영</span>
      </div>
      <button class="button jpeg" id="downloadJpegButton" type="button">JPEG로 저장</button>
    </section>

    <aside class="panel template-panel" aria-label="템플릿 관리">
      <div class="panel-heading template-heading">
        <div><p class="eyebrow">LIBRARY</p><h2>내 템플릿</h2></div>
        <span class="count-badge" id="templateCount">0</span>
      </div>

      <form id="templateForm" class="template-form">
        <label class="sr-only" for="templateName">템플릿 이름</label>
        <input id="templateName" type="text" maxlength="30" placeholder="템플릿 이름" required>
        <button class="button coral-button" id="saveTemplateButton" type="submit">템플릿 저장</button>
      </form>
      <p class="status-message" id="templateMessage" role="status" aria-live="polite"></p>
      <div class="template-list" id="templateList"></div>

      <section class="json-tools">
        <div class="section-title mini"><span class="step ink">JSON</span><h3>백업 및 복원</h3></div>
        <p>템플릿을 한 파일로 내보내거나 복원할 수 있어요.</p>
        <div class="json-actions">
          <button class="button ghost full" id="exportJsonButton" type="button">JSON 내보내기</button>
          <label class="button outline full" for="jsonInput">JSON 가져오기<input id="jsonInput" type="file" accept="application/json,.json"></label>
        </div>
        <p class="status-message" id="jsonMessage" role="status" aria-live="polite"></p>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
